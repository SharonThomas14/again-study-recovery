<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f4ec" />
    <meta
      name="description"
      content="When life interrupts, find your next achievable step. ReStrive helps students rebuild assignment plans with honest trade-offs."
    />
    <title>ReStrive — room to begin again</title>
    <link rel="icon" type="image/png" href="./restrive-logo.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a href="#main" class="skip">Skip to your plan</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="ReStrive home"
          ><span class="brand-mark"><img src="./restrive-logo.png" alt="" /></span>ReStrive</a
        >
        <p class="brand-caption">ROOM TO BEGIN AGAIN</p>
        <nav aria-label="Main navigation">
          <button class="nav-item" data-view="profile"><span>◉</span> Profile</button>
          <button class="nav-item active" data-view="home"><span>⌂</span> Home</button>
          <button class="nav-item" data-view="library"><span>▧</span> Projects / Courses</button>
          <button class="nav-item" data-view="readiness"><span>◔</span> Learning Progress</button>
          <button class="nav-item" data-view="calendar"><span>▦</span> Calendar</button>
        </nav>
        <div class="sidebar-note">
          <span class="little-star">✳</span>
          <p>Life happens.<br />Find your study stride again.</p>
          <span>A SMALL STEP STILL COUNTS.</span>
        </div>
        <button class="local-note" data-action="privacy">
          <span class="status-dot"></span> Saved on this device <span>↗</span>
        </button>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span
            >YOUR STUDY DESK <span class="slash">/</span>
            <span id="top-label">A fresh start</span></span
          >
          <div>
            <span id="today-date"></span
            ><button
              class="avatar"
              data-view="profile"
              aria-label="Open profile"
            >
              ◉
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer>
          <span>Progress has more than one pace.</span
          ><span
            >RESTRIVE / A WORKING PROTOTYPE
            <button data-action="about">About this experiment ↗</button></span
          >
        </footer>
      </div>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
