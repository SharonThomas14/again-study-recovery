<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f4ec" />
    <meta
      name="description"
      content="When life interrupts, find your next achievable step. Again helps students rebuild assignment plans with honest trade-offs."
    />
    <title>Again — room to begin again</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a href="#main" class="skip">Skip to your plan</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="Again home"
          ><img src="./favicon.svg" alt="" />again<span>®</span></a
        >
        <p class="brand-caption">ROOM TO BEGIN AGAIN</p>
        <nav aria-label="Main navigation">
          <button class="nav-item active" data-view="today">
            <span>◒</span> My next step
            <span class="nav-count">01</span></button
          ><button class="nav-item" data-view="plan">
            <span>▤</span> The whole plan</button
          ><button class="nav-item" data-view="library">
            <span>▧</span> Courses & materials</button
          ><button class="nav-item" data-view="readiness">
            <span>◔</span> Learning progress</button
          ><button class="nav-item" data-action="edit">
            <span>↗</span> My assignment
          </button>
        </nav>
        <div class="sidebar-note">
          <span class="little-star">✳</span>
          <p>Life happens.<br />Your plan can change.</p>
          <span>A SMALL STEP STILL COUNTS.</span>
        </div>
        <button class="local-note" data-action="privacy">
          <span class="status-dot"></span> Saved on this device <span>↗</span>
        </button>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span
            >YOUR STUDY DESK <span class="slash">/</span>
            <span id="top-label">A fresh start</span></span
          >
          <div>
            <span id="today-date"></span
            ><button
              class="avatar"
              data-action="edit"
              aria-label="Edit assignment"
            >
              ↗
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer>
          <span>Progress has more than one pace.</span
          ><span
            >AGAIN / A WORKING PROTOTYPE
            <button data-action="about">About this experiment ↗</button></span
          >
        </footer>
      </div>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
